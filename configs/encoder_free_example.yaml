# Configuration for encoder-free semantic chunking

# Input and output settings
input_dir: /path/to/input/data
output_dir: /path/to/output/embeddings
glob_patterns:
  - "*.jsonl"

# Dataset configuration
dataset_config:
  name: encoder_free
  text_field: text
  embeddings_field: embeddings
  batch_size: 8
  num_data_workers: 4
  pin_memory: true

# Pooler configuration
# A pooler is still required by the factory system, but won't be used
pooler_config:
  name: first_token

# Embedder configuration
embedder_config:
  name: encoder_free_semantic_chunk
  breakpoint_percentile_threshold: 90
  min_chunk_length: 750
  chunk_batch_size: 8
  normalize_embeddings: true
  embeddings_key: embeddings

# Writer configuration
writer_config:
  name: hdf5
  compress: true

# Compute configuration for parallel processing
compute_config:
  name: local_thread
  max_threads: 8 