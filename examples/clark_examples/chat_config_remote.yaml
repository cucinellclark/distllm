# This config allows distllm.chat to spawn an interactive chat session with remote embedding.
rag_configs:
  # Generator configuration - adjust server/model/port as needed
  generator_config:
    server: rbdgx2  # Adjust to your available server
    model: meta-llama/Llama-3.3-70B-Instruct  # Adjust to your preferred model
    port: 9999
    api_key: CELS
    temperature: 0.0
    max_tokens: 16384

  # Retriever configuration with remote embedding
  retriever_config:
    faiss_config:
      name: faiss_index_v2
      dataset_dir: /nfs/lambda_stor_01/homes/cucinell/RAG/test_brc_docs/embeddings/85927be5-1130-4ae0-b627-4f6e311882c1  # Replace with actual dataset path
      faiss_index_path: /nfs/lambda_stor_01/homes/cucinell/RAG/chat_logs/brc_docs_test  # Replace with actual index path
      precision: float32
      search_algorithm: exact
      rescore_multiplier: 2
      num_quantization_workers: 1

    # Remote embedding configuration
    # Settings for the embedder.
    embedder_config:
      name: encoder_free_semantic_chunk
      # vLLM parameters (copied from encoder_config)
      server: 140.221.79.23 # lambda13
      port: 9998         
      api_key: AskClark     
      model: Salesforce/SFR-Embedding-Mistral
      # Semantic chunking parameters
      chunk_batch_size: 2
      normalize_embeddings: true
      breakpoint_percentile_threshold: 75
      min_chunk_length: 100
      embeddings_key: embeddings  # This key is used when falling back to pre-computed embeddings

    pooler_config:
      name: last_token  # You can use mean, last_token, or other options

  verbose: false

# Path to save conversation logs
save_conversation_path: /nfs/lambda_stor_01/homes/cucinell/RAG/chat_logs 